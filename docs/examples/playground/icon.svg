<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background subtle ambient glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0B5" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00F0B5" stop-opacity="0" />
    </radialGradient>

    <!-- Shape 1 Gradient: C-Frame Loop -->
    <linearGradient id="gradStage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0B5" />
      <stop offset="100%" stop-color="#00D2C8" />
    </linearGradient>

    <!-- Shape 2 Gradient: Floating Nucleus -->
    <linearGradient id="gradNucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00F0B5" />
    </linearGradient>

    <!-- Shape 3 Gradient: Vertical Stem (P Stem) -->
    <linearGradient id="gradStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00D0B0" />
      <stop offset="100%" stop-color="#008E84" />
    </linearGradient>
  </defs>

  <!-- Canvas App Icon Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#070D12" />
  <circle cx="512" cy="512" r="440" fill="url(#bgGlow)" />

  <!-- Playground Symbol (Inverted P Geometry on 40px Grid) -->
  <g id="playground-symbol">
    <!-- Shape 3: Vertical Stem (Left P Stem) -->
    <rect
      x="252"
      y="212"
      width="120"
      height="640"
      rx="60"
      ry="60"
      fill="url(#gradStem)"
    />

    <!-- Shape 1: C-Frame Loop (Upper Right Loop) -->
    <path
      d="M 440 212 L 604 212 A 168 168 0 0 1 772 380 L 772 564 A 168 168 0 0 1 604 732 L 440 732 A 28 28 0 0 1 412 704 L 412 640 A 28 28 0 0 1 440 612 L 604 612 A 48 48 0 0 0 652 564 L 652 380 A 48 48 0 0 0 604 332 L 440 332 A 28 28 0 0 1 412 304 L 412 240 A 28 28 0 0 1 440 212 Z"
      fill="url(#gradStage)"
    />

    <!-- Shape 2: Floating Nucleus (Inside P Chamber) -->
    <rect
      x="412"
      y="372"
      width="200"
      height="200"
      rx="48"
      ry="48"
      fill="url(#gradNucleus)"
    />
  </g>
</svg>
